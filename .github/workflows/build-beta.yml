name: Build Beta
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize

      - name: Install make
        run: brew install make

      - name: Run make beta
        run: make beta CODE_SIGN_IDENTITY="-"

      # 打印所有目录，用来排查
      - name: List all files
        run: ls -R

      # 自动找 app
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: GoldenPassport-beta
          path: '**/GoldenPassport.app'
