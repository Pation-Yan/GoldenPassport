name: Build Beta
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize

      - name: Install make
        run: brew install make

      - name: Run official make beta (follow README)
        run: |
          export CODE_SIGN_IDENTITY="-"
          export BUILD_ROOT="${GITHUB_WORKSPACE}/build-output"
          make beta

      - name: List built output
        run: ls -laR ./build-output

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoldenPassport-beta
          path: ./build-output
