name: CI

on:
  push:
    branches: [modernize]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}${{ matrix.xcode && format(', Xcode {0}', matrix.xcode) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported toolchain (README: Xcode 16+), so newer Swift can't slip in.
          - os: macos-15
            xcode: "16.0"
          # Each image's default Xcode, up to the current one.
          - os: macos-15
          - os: macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode ${{ matrix.xcode }}
        if: matrix.xcode
        run: |
          DIR="/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer"
          [ -d "$DIR" ] || { echo "::error::Xcode ${{ matrix.xcode }} is not on the ${{ matrix.os }} image"; exit 1; }
          echo "DEVELOPER_DIR=$DIR" >> "$GITHUB_ENV"
      - name: Toolchain
        run: xcodebuild -version && xcrun swift --version
      - name: Unit tests
        run: make test

  package:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build number = commit count
      - name: Check shell scripts
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Build universal beta package
        run: make beta
      - name: Verify bundle
        run: |
          APP="$HOME/Library/Caches/GoldenPassport-build/release/GoldenPassport.app"
          codesign --verify --strict "$APP"
          lipo -archs "$APP/Contents/MacOS/GoldenPassport" | grep -q arm64
          lipo -archs "$APP/Contents/MacOS/GoldenPassport" | grep -q x86_64
          test -f "$APP/Contents/Resources/en.lproj/Localizable.strings"
          test -f "$APP/Contents/Resources/en.lproj/Localizable.stringsdict"
          test -f "$APP/Contents/Resources/zh-Hans.lproj/Localizable.strings"
          test -f "$APP/Contents/Resources/LICENSE"
          # Beta packages report <version>-<label>, so the update check offers the release.
          test "$(/usr/libexec/PlistBuddy -c 'Print :GPPrerelease' "$APP/Contents/Info.plist")" = beta
          # Headless migration check against an empty data directory.
          "$APP/Contents/MacOS/GoldenPassport" --migrate-data --data-dir "$RUNNER_TEMP/gp-data"
      - name: Verify package
        run: |
          ZIP="$(ls ~/Library/Caches/GoldenPassport-build/dist/*.zip)"
          unzip -Z1 "$ZIP" > "$RUNNER_TEMP/zip-list.txt"
          # AppleDouble ._ entries would end up inside the bundle when extracted with unzip.
          if grep '/\._' "$RUNNER_TEMP/zip-list.txt"; then echo "::error::package contains AppleDouble ._ files"; exit 1; fi
          unzip -q "$ZIP" -d "$RUNNER_TEMP/unzipped"
          codesign --verify --strict "$RUNNER_TEMP"/unzipped/*/GoldenPassport.app
      - name: Install from the package
        run: |
          export GP_APPLICATIONS_DIR="$RUNNER_TEMP/apps" GP_DATA_DIR="$RUNNER_TEMP/install-data" \
            GP_BACKUP_ROOT="$RUNNER_TEMP/backups" GP_NO_LAUNCH=1 GP_LANG=en
          mkdir -p "$GP_APPLICATIONS_DIR"
          PACKAGE="$(ls -d "$RUNNER_TEMP"/unzipped/*/)"
          bash "$PACKAGE/install.sh"
          FIRST="$(ls -d "$GP_BACKUP_ROOT"/*/)"
          MANIFEST="$(shasum "$FIRST/manifest.txt")"
          # A second install in the same second must not reuse, and overwrite, that backup.
          mkdir "$RUNNER_TEMP/clock"
          printf '#!/bin/bash\n[ "$1" = "+%%Y%%m%%d-%%H%%M%%S" ] && exec echo %s\nexec /bin/date "$@"\n' \
            "$(basename "$FIRST")" > "$RUNNER_TEMP/clock/date"
          chmod +x "$RUNNER_TEMP/clock/date"
          if PATH="$RUNNER_TEMP/clock:$PATH" bash "$PACKAGE/install.sh" > "$RUNNER_TEMP/second.log" 2>&1; then
            cat "$RUNNER_TEMP/second.log"; echo "::error::install.sh reused an existing backup folder"; exit 1
          fi
          grep -q 'Could not create a new backup folder' "$RUNNER_TEMP/second.log" || { cat "$RUNNER_TEMP/second.log"; exit 1; }
          test "$(shasum "$FIRST/manifest.txt")" = "$MANIFEST"
          # With the real clock, the next install gets a backup folder of its own.
          bash "$PACKAGE/install.sh"
          test "$(ls -d "$GP_BACKUP_ROOT"/*/ | wc -l | tr -d ' ')" -eq 2
      - uses: actions/upload-artifact@v7
        with:
          name: GoldenPassport-beta
          path: ~/Library/Caches/GoldenPassport-build/dist/*.zip
          retention-days: 14
